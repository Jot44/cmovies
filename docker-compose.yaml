services:
  banco_cmovies:
    image: postgres:18.6
    container_name: cmovies_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - dados_cmovies:/var/lib/postgresql

volumes:
  dados_cmovies:
