services:
  banco_cmovies:
    image: postgres:18.6
    container_name: cmovies_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: cmoviesdb
    ports:
      - "5434:5432"
    volumes:
      - dados_cmovies:/var/lib/postgresql

volumes:
  dados_cmovies:
